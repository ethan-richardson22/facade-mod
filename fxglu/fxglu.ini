[display]
; client-area size of the game window at startup (physical pixels)
width=1920
height=1080
; 1 = start in borderless fullscreen (toggle any time with F11 or Alt+Enter)
fullscreen=0
; 1 = fill wide windows with more of the scene instead of black side bars (0 = original framing + bars)
widescreen=1
; multisample antialiasing: 0 = off, 2 / 4 / 8 / 16 (falls back to the highest the GPU supports)
msaa=8
; anisotropic texture filtering: 0 = off, up to 16
anisotropy=16
; action-cursor size in percent: 0 = follow Windows display scaling (200% on a 200% display)
cursor_scale=0

[game]
; 1 = automatically skip the title sequence (same as pressing a key during it).
; Off by default: the long black part of it is Trip's voicemail inviting you over (story setup).
skip_intro=0
; 1 = subtitles on at start (the game's own Subtitles menu item still toggles them)
subtitles=1
; 1 = answer the Java side's questions during the engine's frame sleep instead of making them
;     wait for the next frame (characters react faster; 0 = original behaviour)
fast_answers=1

[java]
; Java executable for the game logic. Empty = the bundled ..\..\j2re1.4.2_06\bin\java.exe
path=
; Full argument list. Empty = the engine's built-in one:
;   -Xms70m -Xmx150m -XX:NewSize=25m -enableassertions -Xfuture -Xincgc -showversion
;   -classpath ../../classes;../../classes/jess.jar facade.Main
args=

[debug]
; 1 = write fxglu_<process>.log (and fxglu_java_out.log) next to the DLL
log=1
; 1 = log engine/Java timing statistics every 10 s ([perf] lines)
perfstats=0
